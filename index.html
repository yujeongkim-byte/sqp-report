<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQP 유입 키워드 인사이트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;background:#f5f6fa;color:#1a1d2e;font-size:14px;}
header{background:#fff;border-bottom:1px solid #e2e6ef;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100;}
header h1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}
.badge{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid;}
.badge-blue{background:rgba(59,108,255,.1);color:#3b6cff;border-color:rgba(59,108,255,.2);}
.badge-green{background:rgba(18,169,112,.1);color:#12a970;border-color:rgba(18,169,112,.2);}
.badge-red{background:rgba(224,61,61,.1);color:#e03d3d;border-color:rgba(224,61,61,.2);}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px;}
.card{background:#fff;border:1px solid #e2e6ef;border-radius:12px;margin-bottom:14px;overflow:hidden;}
.card-head{padding:12px 18px;border-bottom:1px solid #e2e6ef;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.card-head h2{font-size:13px;font-weight:700;}
.card-body{padding:14px 18px;}
.kpi-line{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;line-height:2.2;align-items:center;}
.sep{color:#ddd;}
.note{margin-top:8px;font-size:12px;color:#5a6478;}
table{width:100%;border-collapse:collapse;}
thead th{padding:8px 10px;font-size:10px;color:#3b6cff;font-weight:700;border-bottom:2px solid #3b6cff;background:rgba(59,108,255,.03);white-space:nowrap;}
thead th.left{text-align:left;}
tbody tr{border-bottom:1px solid #f5f6fa;transition:.1s;}
tbody tr:hover{background:#f8faff;}
td{padding:8px 10px;text-align:right;font-family:monospace;font-size:11px;vertical-align:middle;}
td.left{text-align:left;font-family:inherit;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sec{background:#fff;border:1px solid #e2e6ef;border-radius:12px;padding:14px 16px;}
.sec-kpi{font-size:11px;font-family:monospace;line-height:2;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #f0f2f8;}
.kw-line{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid #f5f6fa;font-size:12px;line-height:1.7;}

/* 업로드 패널 */
.upload-panel{background:#fff;border:1px solid #e2e6ef;border-radius:12px;padding:16px 20px;margin-bottom:14px;display:none;}
.upload-panel.open{display:block;}
.pw-input{border:1px solid #e2e6ef;border-radius:7px;padding:7px 12px;font-size:13px;width:200px;}
.pw-input:focus{outline:none;border-color:#3b6cff;}
.btn{padding:7px 14px;border-radius:7px;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;}
.btn-primary{background:#3b6cff;color:#fff;} .btn-primary:hover{opacity:.85;}
.btn-ghost{background:#f0f2f8;color:#5a6478;} .btn-ghost:hover{background:#e2e6ef;}
.btn-red{background:#e03d3d;color:#fff;}
.file-drop{border:1.5px dashed #c5d0e8;border-radius:10px;padding:14px 18px;text-align:center;cursor:pointer;transition:.15s;background:#f8faff;}
.file-drop:hover{border-color:#3b6cff;}
input[type=file]{display:none;}
.log{font-size:11px;color:#666;line-height:1.8;margin-top:8px;min-height:0;}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #e2e6ef;border-top-color:#3b6cff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:4px;}
@keyframes spin{to{transform:rotate(360deg);}}
.action-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f5f6fa;font-size:12px;align-items:flex-start;}
.action-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;margin-top:1px;}
.week-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.week-chip{padding:4px 12px;border-radius:20px;border:1px solid #e2e6ef;background:#f8faff;font-size:12px;cursor:pointer;transition:.15s;}
.week-chip:hover{border-color:#3b6cff;color:#3b6cff;}
.week-chip.active{background:#3b6cff;border-color:#3b6cff;color:#fff;font-weight:600;}
.empty{text-align:center;padding:60px 20px;color:#aaa;}
.empty h3{font-size:16px;margin-bottom:8px;color:#5a6478;}
::-webkit-scrollbar{width:4px;height:4px;} ::-webkit-scrollbar-thumb{background:#e2e6ef;border-radius:2px;}
</style>
</head>
<body>

<header>
  <h1>🔍 SQP 유입 키워드 인사이트</h1>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <span class="badge badge-blue" id="dataBadge">로딩 중...</span>
    <button class="btn btn-ghost" onclick="toggleUpload()" id="uploadToggle">🔒 관리자</button>
  </div>
</header>

<div class="wrap">

  <!-- 관리자 업로드 패널 -->
  <div class="upload-panel" id="uploadPanel">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
      <span style="font-size:13px;font-weight:600;">🔑 비밀번호</span>
      <input type="password" class="pw-input" id="pwInput" placeholder="비밀번호 입력">
      <button class="btn btn-primary" onclick="verifyPassword()">확인</button>
      <span id="authStatus" style="font-size:12px;color:#aaa;"></span>
    </div>
    <div id="adminArea" style="display:none;">
      <div class="file-drop" onclick="document.getElementById('csvInput').click()">
        <div style="font-size:20px;margin-bottom:6px;">📂</div>
        <strong style="font-size:13px;">SQP CSV 파일 선택</strong>
        <div style="font-size:11px;color:#888;margin-top:4px;">영문 원본 / 한국어 RD 피봇 · 여러 파일 동시 업로드 가능</div>
        <input type="file" id="csvInput" accept=".csv,.tsv,.txt" multiple>
      </div>
      <div class="log" id="uploadLog"></div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-red" onclick="deleteAll()" style="font-size:11px;">🗑 전체 초기화</button>
        <span id="weekDeleteArea"></span>
      </div>
    </div>
  </div>

  <!-- 주차 선택 -->
  <div class="card" id="weekCard" style="display:none;">
    <div class="card-head"><h2>주차 선택</h2><span id="weekCountBadge" class="badge badge-blue"></span></div>
    <div class="card-body">
      <div class="week-chips" id="weekChips"></div>
    </div>
  </div>

  <!-- 인사이트 영역 -->
  <div id="insightArea">
    <div class="empty">
      <div style="font-size:40px;margin-bottom:12px;">🔍</div>
      <h3>데이터를 불러오는 중...</h3>
    </div>
  </div>

</div>

<script>
// ── 설정 ──
const API = 'https://sqp-api.yujeong-kim.workers.dev'; // Worker URL로 교체
let pw = '';
let sqpData = [];
let selectedWeek = '';
let weeks = [];

// ── 초기 데이터 로드 ──
async function loadData() {
  try {
    const res = await fetch(API + '/api/data');
    const json = await res.json();
    sqpData = json.data || [];
    
    // 서버에 데이터 없으면 시드 데이터 사용
    if (!sqpData.length) {
      sqpData = SEED_DATA;
    }
    
    processData();
  } catch(e) {
    // 오프라인이거나 API 미설정 시 시드 데이터 사용
    sqpData = SEED_DATA;
    processData();
    document.getElementById('dataBadge').textContent = '로컬 데이터';
  }
}

function processData() {
  weeks = Array.from(new Set(sqpData.map(d=>d.week))).sort();
  const badge = document.getElementById('dataBadge');
  badge.textContent = weeks.length + '주차 / ' + sqpData.length + '행';
  badge.className = 'badge badge-green';
  
  if (weeks.length) {
    document.getElementById('weekCard').style.display = 'block';
    renderWeekChips();
    selectWeek(weeks[weeks.length-1]);
  } else {
    document.getElementById('insightArea').innerHTML = '<div class="empty"><h3>데이터 없음</h3><p>관리자로 로그인하여 CSV를 업로드하세요.</p></div>';
  }
}

// ── 주차 선택 ──
function renderWeekChips() {
  const el = document.getElementById('weekChips');
  el.innerHTML = weeks.map(w => 
    `<button class="week-chip${w===selectedWeek?' active':''}" onclick="selectWeek('${w}')">${fmtW(w)}</button>`
  ).join('');
  document.getElementById('weekCountBadge').textContent = weeks.length + '주';
}

function selectWeek(week) {
  selectedWeek = week;
  renderWeekChips();
  renderInsight(week);
}

// ── 유틸 ──
function fmtW(w){ const m=w.match(/(\d{4})-(\d{2})-(\d{2})/); return m?m[1]+'.'+parseInt(m[2])+'.'+parseInt(m[3]):w; }
function isBrand(k){ return ['esther','strips','lyuh','jiwoo','ester formula'].some(b=>k.includes(b)); }
function cvrC(v){ return v>=15?'#12a970':v>=10?'#3b6cff':v<5?'#e03d3d':'#1a1d2e'; }
function N(n){ return n>=10000?(n/10000).toFixed(1)+'만':n.toLocaleString(); }
function pct(a,b){ return b?(a-b)/b*100:null; }
function chg(v,isP=false){
  if(v===null||v===undefined) return '';
  const s=(v>=0?'+':'')+v.toFixed(isP?2:0)+(isP?'%p':'%');
  return `<span style="font-size:10px;color:${v>0?'#12a970':'#e03d3d'}">(${s})</span>`;
}
function kpiSpan(label,cur,prev,isP=false){
  const diff=prev!=null?(isP?cur-prev:pct(cur,prev)):null;
  const cs=isP?cur.toFixed(2)+'%':N(cur);
  const ps=prev!=null?(isP?prev.toFixed(2)+'%':N(prev)):null;
  const arr=diff!=null?` <span style="color:${diff>0?'#12a970':'#e03d3d'};font-size:11px">${diff>0?'▲':'▼'}${diff>=0?'+':''}${diff.toFixed(1)}${isP?'pp':'%'}</span>`:'';
  return `<span style="color:#666">${label}:</span> ${ps!=null?`<span style="color:#999;font-size:11px">${ps} →</span> `:''}${cs}${arr}`;
}
function tot(rows){ const c=rows.reduce((s,d)=>s+d.clicks,0),p=rows.reduce((s,d)=>s+d.purchases,0); return {impressions:rows.reduce((s,d)=>s+d.impressions,0),clicks:c,purchases:p,cvr:c>0?p/c*100:0}; }
function find(kw,arr){ return arr.find(x=>x.keyword===kw); }

// ── 인사이트 렌더링 ──
function renderInsight(week) {
  const wi=weeks.indexOf(week), prevW=wi>0?weeks[wi-1]:null;
  const cur=sqpData.filter(d=>d.week===week).sort((a,b)=>a.rank-b.rank);
  const prev=prevW?sqpData.filter(d=>d.week===prevW).sort((a,b)=>a.rank-b.rank):[];
  const top10=cur.slice(0,10), top20=cur.slice(0,20);
  const T=tot(top10), PT=prev.length?tot(prev.slice(0,10)):null;
  const brandCur=top20.filter(d=>isBrand(d.keyword)), genCur=top20.filter(d=>!isBrand(d.keyword));
  const bT=tot(brandCur), gT=tot(genCur);
  const pbT=tot(brandCur.filter(d=>find(d.keyword,prev)).map(d=>find(d.keyword,prev)));
  const pgT=tot(genCur.filter(d=>find(d.keyword,prev)).map(d=>find(d.keyword,prev)));
  const newKws=top20.filter(d=>!find(d.keyword,prev));
  const exitKws=prev.slice(0,20).filter(p=>!find(p.keyword,top20));

  const iC=PT?pct(T.impressions,PT.impressions):null;
  const pC=PT?pct(T.purchases,PT.purchases):null;
  const cC=PT?T.cvr-PT.cvr:null;
  let summary='전주 데이터 없음';
  if(iC!==null){
    if(iC>20&&pC>20) summary='노출·구매 동반 급증 — 이벤트 또는 광고 확대 효과';
    else if(iC>10&&pC<0) summary='노출 증가에도 구매 감소 — 트래픽 효율 하락, 전환 점검 필요';
    else if(iC<-20&&pC>0) summary='노출 급감에도 구매 유지 — 고의도 트래픽 집중, 효율 개선';
    else if(iC<-10&&pC<-10) summary='노출·구매 동반 감소 — 이벤트 이후 정상화 또는 광고 축소 영향';
    else if(pC>10&&cC>0) summary='구매·전환율 동반 개선 — 효율 상승 흐름';
    else if(pC<-10&&cC<-1) summary='구매·전환율 동반 하락 — 원인 파악 필요';
    else summary='전반적 안정적 유지, 추세 모니터링';
  }

  function tableRow(d,i){
    const p=find(d.keyword,prev);
    const pc=p?pct(d.purchases,p.purchases):null, cc=p?d.cvr-p.cvr:null;
    const kc=isBrand(d.keyword)?'#3b6cff':'#1a1d2e';
    const nb=!p?'<span style="font-size:9px;background:rgba(18,169,112,.12);color:#12a970;border:1px solid rgba(18,169,112,.2);padding:1px 5px;border-radius:3px;margin-left:4px">NEW</span>':'';
    return `<tr>
      <td class="left" style="color:#aaa">${d.rank}</td>
      <td class="left" style="font-weight:600;color:${kc};font-size:12px">${d.keyword}${nb}</td>
      <td style="color:#aaa">${p?p.impressions.toLocaleString():'–'}</td>
      <td style="font-weight:600">${d.impressions.toLocaleString()}</td>
      <td style="color:#aaa">${p?p.purchases:'–'}</td>
      <td style="font-weight:600;color:${pc!=null?(pc>=0?'#12a970':'#e03d3d'):'#333'}">${d.purchases} ${chg(pc)}</td>
      <td style="color:${p?cvrC(p.cvr):'#aaa'}">${p?p.cvr.toFixed(2)+'%':'–'}</td>
      <td style="font-weight:600;color:${cvrC(d.cvr)}">${d.cvr.toFixed(2)}% ${chg(cc,true)}</td>
    </tr>`;
  }

  function kwLine(d){
    const p=find(d.keyword,prev);
    const kc=isBrand(d.keyword)?'#3b6cff':'#1a1d2e';
    const parts=[];
    if(!p){ parts.push(`신규 진입, 전환율 <strong style="color:${cvrC(d.cvr)}">${d.cvr.toFixed(2)}%</strong>${d.cvr>=15?' ★고전환':d.cvr<5?' (저전환)':''}`); }
    else {
      const ic=pct(d.impressions,p.impressions), pc=pct(d.purchases,p.purchases), cc=d.cvr-p.cvr;
      if(ic&&Math.abs(ic)>=30) parts.push(`노출 <span style="color:${ic>0?'#12a970':'#e03d3d'}">${ic>0?'+':''}${ic.toFixed(0)}%</span> ${ic>0?'급증':'급감'}`);
      if(pc&&Math.abs(pc)>=30) parts.push(`구매 <span style="color:${pc>0?'#12a970':'#e03d3d'}">${pc>0?'+':''}${pc.toFixed(0)}%</span> (${p.purchases}→${d.purchases}건)${pc<0&&cc<-3?' <span style="color:#e03d3d">⚠ 바이박스 점검</span>':''}`);
      else parts.push(`구매 ${d.purchases}건`);
      if(Math.abs(cc)>=3) parts.push(`전환율 ${p.cvr.toFixed(1)}%→<strong style="color:${cvrC(d.cvr)}">${d.cvr.toFixed(1)}%</strong>`);
      else parts.push(`전환율 <strong style="color:${cvrC(d.cvr)}">${d.cvr.toFixed(2)}%</strong>`);
    }
    return `<div class="kw-line"><span style="color:#ccc;flex-shrink:0">ㄴ</span><div><span style="font-weight:600;color:${kc}">${d.keyword}</span> — ${parts.join(', ')}</div></div>`;
  }

  const actions=[];
  top20.forEach(d=>{
    const p=find(d.keyword,prev); if(!p)return;
    const pc=pct(d.purchases,p.purchases), cc=d.cvr-p.cvr;
    if(pc<=-30&&cc<-2) actions.push({tag:'🚨 즉시',col:'#e03d3d',bg:'rgba(224,61,61,.08)',txt:`${d.keyword} — 구매 급감 (${p.purchases}→${d.purchases}건), 바이박스/랜딩 점검`});
    else if(pc<=-30) actions.push({tag:'🚨 즉시',col:'#e03d3d',bg:'rgba(224,61,61,.08)',txt:`${d.keyword} — 구매 ${pc.toFixed(0)}% 급감`});
    else if(d.cvr>=15&&p.cvr<12) actions.push({tag:'📈 강화',col:'#12a970',bg:'rgba(18,169,112,.08)',txt:`${d.keyword} — 전환율 ${d.cvr.toFixed(1)}%, 입찰 확대 검토`});
    else if(d.cvr<5&&p.cvr>8) actions.push({tag:'⚠️ 점검',col:'#d97706',bg:'rgba(212,119,6,.08)',txt:`${d.keyword} — 전환율 ${p.cvr.toFixed(1)}%→${d.cvr.toFixed(1)}%, 원인 파악`});
  });
  newKws.filter(d=>d.cvr>=10).forEach(d=>actions.push({tag:'🆕 신규',col:'#3b6cff',bg:'rgba(59,108,255,.08)',txt:`${d.keyword} — 신규 고전환(${d.cvr.toFixed(1)}%), 수동 입찰 검토`}));

  const newB=newKws.filter(d=>isBrand(d.keyword)), newG=newKws.filter(d=>!isBrand(d.keyword));

  document.getElementById('insightArea').innerHTML = `
  <div class="card">
    <div class="card-head">
      <h2>📊 전체 요약 · TOP 10 기준</h2>
      <span style="font-size:11px;color:#adb5c7">${fmtW(prevW||'')} → ${fmtW(week)}</span>
    </div>
    <div class="card-body">
      <div class="kpi-line">
        ${kpiSpan('노출',T.impressions,PT?.impressions??null)} <span class="sep">/</span>
        ${kpiSpan('클릭',T.clicks,PT?.clicks??null)} <span class="sep">/</span>
        ${kpiSpan('구매',T.purchases,PT?.purchases??null)} <span class="sep">/</span>
        ${kpiSpan('전환율',T.cvr,PT?.cvr??null,true)}
      </div>
      <div class="note">ㄴ ${summary}</div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>TOP 10 키워드 전주 비교</h2>
      <span style="font-size:10px;color:#adb5c7">${fmtW(prevW||'')} → ${fmtW(week)}</span>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr>
          <th class="left" style="width:28px">#</th>
          <th class="left">키워드</th>
          <th>노출(전)</th><th>노출(후)</th>
          <th>구매(전)</th><th>구매(후)</th>
          <th>전환율(전)</th><th>전환율(후)</th>
        </tr></thead>
        <tbody>${top10.map((d,i)=>tableRow(d,i)).join('')}</tbody>
      </table>
    </div>
  </div>

  ${actions.length?`<div class="card">
    <div class="card-head"><h2>[핵심 액션 아이템]</h2></div>
    <div class="card-body">
      ${actions.map(a=>`<div class="action-item"><span class="action-tag" style="background:${a.bg};color:${a.col}">${a.tag}</span><span style="color:#5a6478">${a.txt}</span></div>`).join('')}
    </div>
  </div>`:''}

  <div class="two-col">
    <div class="sec">
      <div style="font-size:11px;font-weight:700;color:#3b6cff;margin-bottom:8px">[브랜드 키워드] <span style="font-weight:400;color:#adb5c7;font-size:10px">esther·strips·lyuh·jiwoo</span></div>
      <div class="sec-kpi">
        노출: ${N(pbT.impressions||0)} → ${N(bT.impressions)} ${chg(pct(bT.impressions,pbT.impressions))}<br>
        구매: ${pbT.purchases||0} → ${bT.purchases} ${chg(pct(bT.purchases,pbT.purchases))}<br>
        전환율: ${(pbT.cvr||0).toFixed(2)}% → ${bT.cvr.toFixed(2)}% ${chg(bT.cvr-(pbT.cvr||0),true)}
      </div>
      ${brandCur.map(d=>kwLine(d)).join('')}
      ${newB.length?`<div style="font-size:11px;color:#12a970;margin-top:6px;padding:4px 8px;background:#f0fff8;border-radius:5px">🆕 ${newB.map(d=>d.keyword).join(', ')}</div>`:''}
    </div>

function toggleUpload() {
  const panel = document.getElementById('uploadPanel');
  panel.classList.toggle('open');
}

async function verifyPassword() {
  const input = document.getElementById('pwInput').value;
  const status = document.getElementById('authStatus');
  status.innerHTML = '<span class="spinner"></span> 확인 중...';
  try {
    const res = await fetch(API + '/api/data', { headers: { 'X-Password': input } });
    // 간단히 업로드 테스트
    const testRes = await fetch(API + '/api/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Password': input },
      body: JSON.stringify({ data: [] })
    });
    if (testRes.status !== 401) {
      pw = input;
      status.innerHTML = '<span style="color:#12a970">✅ 인증 완료</span>';
      document.getElementById('adminArea').style.display = 'block';
      renderWeekDeleteButtons();
      // 파일 input 이벤트
      document.getElementById('csvInput').addEventListener('change', function() {
        Array.from(this.files).forEach(f => {
          const r = new FileReader();
          r.onload = e => parseAndUpload(e.target.result, f.name);
          r.readAsText(f, 'UTF-8');
        });
      });
    } else {
      status.innerHTML = '<span style="color:#e03d3d">❌ 비밀번호 오류</span>';
    }
  } catch(e) {
    status.innerHTML = '<span style="color:#d97706">⚠️ API 연결 실패 (Worker URL 확인 필요)</span>';
  }
}

function renderWeekDeleteButtons() {
  const el = document.getElementById('weekDeleteArea');
  el.innerHTML = weeks.map(w =>
    `<button class="btn btn-ghost" style="font-size:11px;margin:2px" onclick="deleteWeek('${w}')">🗑 ${fmtW(w)}</button>`
  ).join('');
}

async function deleteWeek(week) {
  if (!confirm(`${fmtW(week)} 주차 데이터를 삭제할까요?`)) return;
  const res = await fetch(API + '/api/week/' + encodeURIComponent(week), {
    method: 'DELETE', headers: { 'X-Password': pw }
  });
  const json = await res.json();
  if (json.ok) { addLog('✅ ' + fmtW(week) + ' 삭제 완료'); await loadData(); }
  else addLog('❌ ' + json.error);
}

async function deleteAll() {
  if (!confirm('전체 데이터를 초기화할까요? 복구 불가능합니다.')) return;
  const res = await fetch(API + '/api/all', { method: 'DELETE', headers: { 'X-Password': pw } });
  const json = await res.json();
  if (json.ok) { addLog('✅ 전체 초기화 완료'); await loadData(); }
}

// ── CSV 파싱 & 업로드 ──
async function parseAndUpload(text, filename) {
  text = text.replace(/^﻿/, '');
  const allLines = text.split('
').map(l => l.trim()).filter(Boolean);
  if (allLines.length < 2) { addLog('❌ ' + filename + ': 데이터 부족'); return; }

  let weekMeta = '', skip = 0;
  if (allLines[0].includes('Brand=[') || allLines[0].includes('Reporting Range') || allLines[0].includes('Select week')) {
    const m = allLines[0].match(/(\d{4}-\d{2}-\d{2})/); if (m) weekMeta = m[1]; skip = 1;
  }
  const lines = allLines.slice(skip);
  const delim = lines[0].includes('	') ? '	' : ',';

  function splitRow(line) {
    const res = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; continue; }
      if (ch === delim && !inQ) { res.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    res.push(cur.trim()); return res;
  }

  const hdr = splitRow(lines[0]);
  const fi = (...keys) => { for (const k of keys) { const i = hdr.findIndex(h => h.toLowerCase().includes(k.toLowerCase())); if (i >= 0) return i; } return -1; };
  const iK=fi('Search Query','유입 검색어'), iR=fi('Search Query Score','순위');
  const iI=fi('Impressions: Brand Count','노출 수'), iIS=fi('Impressions: Brand Share','노출 점유율');
  const iC=fi('Clicks: Brand Count','클릭 수'), iCS=fi('Clicks: Brand Share','클릭 점유율');
  const iCt=fi('Cart Adds: Brand Count','장바구니'), iP=fi('Purchases: Brand Count','구매 수');
  const iCV=fi('전환율','CVR');

  const rows = []; let curW = weekMeta;
  for (let i = 1; i < lines.length; i++) {
    const cols = splitRow(lines[i]); if (cols.length < 3) continue;
    if (iK >= 0 && cols[0] && cols[0].match(/\d{4}/)) curW = cols[0];
    const kw = iK >= 0 && iK < cols.length ? cols[iK].toLowerCase().trim() : '';
    if (!kw || kw.includes('total')) continue;
    const pn = idx => idx >= 0 && idx < cols.length && cols[idx] ? parseFloat(cols[idx].replace(/[,%]/g, '')) || 0 : 0;
    const cl = pn(iC), pu = pn(iP), cv = iCV < 0 ? (cl > 0 ? pu/cl*100 : 0) : pn(iCV);
    const week = curW.replace(/(\d{4})[.\s-]+(\d{1,2})[.\s-]+(\d{1,2})/, (_, y, m, d) => `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`);
    if (!week) continue;
    rows.push({ week, rank: Math.round(pn(iR)), keyword: kw, impressions: Math.round(pn(iI)), impShare: pn(iIS), clicks: Math.round(cl), clickShare: pn(iCS), cart: Math.round(pn(iCt)), purchases: Math.round(pu), cvr });
  }

  if (!rows.length) { addLog('❌ ' + filename + ': 파싱된 데이터 없음'); return; }
  addLog('⏳ ' + filename + ': ' + rows.length + '행 업로드 중...');

  const res = await fetch(API + '/api/upload', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Password': pw },
    body: JSON.stringify({ data: rows })
  });
  const json = await res.json();
  if (json.ok) {
    addLog(`✅ ${filename}: ${json.added}개 추가, ${json.updated}개 갱신 | 총 ${json.total}행`);
    await loadData();
    renderWeekDeleteButtons();
  } else {
    addLog('❌ ' + json.error);
  }
}

function addLog(msg) {
  const el = document.getElementById('uploadLog');
  el.innerHTML += '<div>' + msg + '</div>';
}
